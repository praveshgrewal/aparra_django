{% extends 'base.html' %}
{% block title %}Register - Aparra{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="{% url 'store:homepage' %}" class="font-headline text-3xl font-bold text-primary">Aparra</a>
      <h2 class="text-xl font-semibold mt-4">Create an account</h2>
      <p class="text-muted-foreground text-sm mt-1">Join the Aparra family</p>
    </div>
    <div class="bg-card border border-border rounded-lg shadow-sm p-8">
      <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
          <div>
            <label class="text-xs font-semibold text-muted-foreground block mb-1">Full Name</label>
            <input type="text" name="name" required placeholder="Your name"
                   class="w-full border border-input rounded-md px-4 py-3 text-sm bg-background focus:outline-none focus:ring-1 focus:ring-primary">
          </div>
          <div>
            <label class="text-xs font-semibold text-muted-foreground block mb-1">Email</label>
            <input type="email" name="email" required placeholder="your@email.com"
                   class="w-full border border-input rounded-md px-4 py-3 text-sm bg-background focus:outline-none focus:ring-1 focus:ring-primary">
          </div>
          <div>
            <label class="text-xs font-semibold text-muted-foreground block mb-1">Phone (optional)</label>
            <input type="tel" name="phone" placeholder="+91 9999999999"
                   class="w-full border border-input rounded-md px-4 py-3 text-sm bg-background focus:outline-none focus:ring-1 focus:ring-primary">
          </div>
          <div>
            <label class="text-xs font-semibold text-muted-foreground block mb-1">Password</label>
            <input type="password" name="password" required placeholder="Min 8 characters"
                   class="w-full border border-input rounded-md px-4 py-3 text-sm bg-background focus:outline-none focus:ring-1 focus:ring-primary">
          </div>
          <div>
            <label class="text-xs font-semibold text-muted-foreground block mb-1">Confirm Password</label>
            <input type="password" name="confirm_password" required placeholder="Repeat password"
                   class="w-full border border-input rounded-md px-4 py-3 text-sm bg-background focus:outline-none focus:ring-1 focus:ring-primary">
          </div>
        </div>
        <button type="submit" class="w-full mt-6 bg-primary hover:bg-primary/90 text-primary-foreground font-semibold py-3 rounded-md transition-colors">Create Account</button>
      </form>
      <p class="text-center text-sm text-muted-foreground mt-6">
        Already have an account? <a href="{% url 'accounts:login' %}" class="text-primary font-semibold hover:underline">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
