{% extends 'base.html' %}
{% block title %}Login - Aparra{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="{% url 'store:homepage' %}" class="font-headline text-3xl font-bold text-primary">Aparra</a>
      <h2 class="text-xl font-semibold mt-4">Welcome back</h2>
      <p class="text-muted-foreground text-sm mt-1">Sign in to your account</p>
    </div>
    <div class="bg-card border border-border rounded-lg shadow-sm p-8">
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="space-y-4">
          <div>
            <label class="text-xs font-semibold text-muted-foreground block mb-1">Email</label>
            <input type="email" name="email" required placeholder="your@email.com"
                   class="w-full border border-input rounded-md px-4 py-3 text-sm bg-background focus:outline-none focus:ring-1 focus:ring-primary">
          </div>
          <div>
            <label class="text-xs font-semibold text-muted-foreground block mb-1">Password</label>
            <input type="password" name="password" required placeholder="••••••••"
                   class="w-full border border-input rounded-md px-4 py-3 text-sm bg-background focus:outline-none focus:ring-1 focus:ring-primary">
          </div>
        </div>
        <button type="submit" class="w-full mt-6 bg-primary hover:bg-primary/90 text-primary-foreground font-semibold py-3 rounded-md transition-colors">Sign In</button>
      </form>
      <p class="text-center text-sm text-muted-foreground mt-6">
        Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary font-semibold hover:underline">Register</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
