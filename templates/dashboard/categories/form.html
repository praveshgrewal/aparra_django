{% extends 'dashboard/base_dashboard.html' %}
{% block title %}{% if category %}Edit{% else %}New{% endif %} Category - Admin{% endblock %}
{% block page_title %}{% if category %}Edit Category{% else %}New Category{% endif %}{% endblock %}
{% block content %}
<div class="max-w-2xl">
  <form method="post" class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm space-y-4">
    {% csrf_token %}
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">Category Name *</label>
      <input type="text" name="name" value="{{ category.name|default:'' }}" required class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold">
    </div>
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">Description</label>
      <textarea name="description" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold">{{ category.description|default:'' }}</textarea>
    </div>
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">Image URL</label>
      <input type="url" name="image_url" value="{{ category.image_url|default:'' }}" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold">
    </div>
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">Parent Category</label>
      <select name="parent_id" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold">
        <option value="">None (top-level)</option>
        {% for p in parents %}
        <option value="{{ p.id }}" {% if category.parent_id == p.id %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
      </select>
    </div>
    <label class="flex items-center gap-2 cursor-pointer">
      <input type="checkbox" name="is_active" {% if category.is_active|default:True %}checked{% endif %} class="rounded text-gold">
      <span class="text-sm">Active</span>
    </label>
    <div class="flex gap-3">
      <button type="submit" class="bg-gold text-white px-6 py-2 rounded-lg font-semibold text-sm hover:bg-gold-dark">Save</button>
      <a href="{% url 'dashboard:category_list' %}" class="border border-gray-200 text-gray-600 px-6 py-2 rounded-lg text-sm hover:border-gray-300">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
