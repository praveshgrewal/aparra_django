{% extends 'dashboard/base_dashboard.html' %}
{% block title %}Settings - Admin{% endblock %}
{% block page_title %}Settings{% endblock %}
{% block content %}
<form method="post" action="{% url 'dashboard:settings_save' %}" class="max-w-2xl space-y-6">
  {% csrf_token %}
  <!-- Store Info -->
  <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm space-y-4">
    <h2 class="font-semibold">Store Information</h2>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="text-xs font-semibold text-gray-500 block mb-1">Store Name</label><input type="text" name="store_name" value="{{ settings_data.store.name|default:'' }}" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold"></div>
      <div><label class="text-xs font-semibold text-gray-500 block mb-1">Email</label><input type="email" name="store_email" value="{{ settings_data.store.email|default:'' }}" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold"></div>
      <div><label class="text-xs font-semibold text-gray-500 block mb-1">Phone</label><input type="text" name="store_phone" value="{{ settings_data.store.phone|default:'' }}" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold"></div>
      <div><label class="text-xs font-semibold text-gray-500 block mb-1">Currency</label><input type="text" name="currency" value="{{ settings_data.store.currency|default:'INR' }}" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold"></div>
    </div>
    <div><label class="text-xs font-semibold text-gray-500 block mb-1">Address</label><textarea name="store_address" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold">{{ settings_data.store.address|default:'' }}</textarea></div>
  </div>

  <!-- WhatsApp -->
  <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm space-y-4">
    <h2 class="font-semibold">WhatsApp Widget</h2>
    <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="whatsapp_enabled" {% if settings_data.whatsapp.enabled %}checked{% endif %} class="rounded text-gold"> Enable WhatsApp Chat Widget</label>
    <div><label class="text-xs font-semibold text-gray-500 block mb-1">Phone Number (with country code)</label><input type="text" name="whatsapp_phone" value="{{ settings_data.whatsapp.phoneNumber|default:'' }}" placeholder="919999999999" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold"></div>
    <div><label class="text-xs font-semibold text-gray-500 block mb-1">Default Message</label><input type="text" name="whatsapp_message" value="{{ settings_data.whatsapp.defaultMessage|default:'' }}" placeholder="Hello! I'd like to enquire about..." class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold"></div>
  </div>

  <button type="submit" class="bg-gold text-white px-8 py-3 rounded-xl font-semibold hover:bg-gold-dark">Save Settings</button>
</form>
{% endblock %}
